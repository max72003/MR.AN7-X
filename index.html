<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR.AN7 APEX SPACE</title>
<style>
:root{--bg:#050b1f;--card:#0d1a3a;--tx:#eaf1ff;--mut:#a9b8d9;--or:#ff7a1a;--bl:#2f8cff;--bd:#1d3366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f3f7ff;--card:#fff;--tx:#0a1633;--mut:#46567d;--bd:#c9d7f5}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:2px solid var(--or);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.brand img{height:42px;border-radius:8px}.brand b{color:var(--or)}
nav{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.9rem}nav a{color:var(--mut);text-decoration:none}nav a:hover{color:var(--or)}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bl);border-radius:8px;padding:6px 10px;font-size:.95rem}
.hero{text-align:center;padding:40px 16px 56px;background:radial-gradient(ellipse at 50% 0,rgba(47,140,255,.35),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(255,122,26,.3),transparent 55%)}
.hero>img{width:min(100%,760px);border-radius:18px;border:2px solid var(--bl);box-shadow:0 0 40px rgba(255,122,26,.35)}
.hero h1{font-size:clamp(1.8rem,5vw,3.2rem);margin:24px 0 6px}.hero h1 span{color:var(--or)}
.hero p{font-size:1.3rem;color:var(--bl);margin:0;font-weight:700}
main{max-width:1000px;margin:auto;padding:24px 16px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
section{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--or);border-radius:14px;padding:20px}
section:nth-child(even){border-top-color:var(--bl)}
section h2{margin:0 0 8px;color:var(--or)}section:nth-child(even) h2{color:var(--bl)}
section p{margin:0;color:var(--tx)}
.wide{grid-column:1/-1}.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:12px}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px}.cd b{color:var(--or);display:block}.cd i{color:var(--bl);font-style:normal;font-size:.85rem}.cd span{color:var(--mut);font-size:.9rem}
.chips,.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips span{border:1px solid var(--bl);border-radius:99px;padding:4px 14px;font-size:.9rem}
.steps span{background:linear-gradient(90deg,var(--bl),var(--or));color:#fff;padding:6px 16px;border-radius:8px;font-weight:700}
h3{margin:18px 0 0}
#gl{max-width:1000px;margin:6px auto;padding:0 16px}
.gbox{display:grid;gap:14px;margin-top:12px;grid-template-columns:minmax(0,2fr) minmax(240px,1fr)}@media(max-width:800px){.gbox{grid-template-columns:1fr}}
#gc{width:100%;aspect-ratio:1;background:#020611;border:1px solid var(--bl);border-radius:14px;touch-action:none;cursor:grab}
.pn{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px;font-size:.88rem}
.pn h4{margin:12px 0 4px;color:var(--or)}.pn h4:first-child{margin-top:0}
#sl{max-height:300px;overflow:auto;line-height:1.55}#gs{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bl);border-radius:8px;padding:6px}#iss{max-width:1400px;margin:18px auto;padding:0 12px}
.stage{position:relative;overflow:hidden;border-radius:16px;border:2px solid var(--bl);aspect-ratio:1581/672;background:#000;box-shadow:0 0 40px rgba(47,140,255,.3);margin-top:12px}
.sc{position:absolute;inset:0;background:var(--img) center/100% 100%;animation:kb 40s ease-in-out infinite alternate}
.ly{position:absolute;background-image:var(--img);background-repeat:no-repeat;animation:fl var(--t) ease-in-out infinite;-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect;will-change:transform}
.ly.sp{animation:sp 50s linear infinite}.ly.pl{animation:pl 5s ease-in-out infinite alternate}
.sun{position:absolute;left:50%;top:13%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,240,200,.85),rgba(255,160,60,.25) 35%,transparent 65%);mix-blend-mode:screen;animation:sn 5s ease-in-out infinite alternate;pointer-events:none}
.gl{position:absolute;left:55.6%;top:0;width:15.8%;height:34%;overflow:hidden;mix-blend-mode:screen;pointer-events:none}
.gl:after{content:"";position:absolute;inset:-50%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);animation:gs 4s linear infinite}
.ss{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06) translate(-.6%,.4%)}}
@keyframes fl{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.35) saturate(1.5)}}
@keyframes sn{from{opacity:.35;transform:translate(-50%,-50%) scale(.85)}to{opacity:.9;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes gs{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.sc,.ly,.sun,.gl:after,.ss{animation:none!important}}
.hud{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 8px}.hud div{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}.hud b{display:block;color:var(--or);font-size:1.05rem}.hud span{color:var(--mut);font-size:.8rem}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--or));width:0;transition:width 1s linear}
#cos{max-width:1400px;margin:18px auto;padding:0 12px}
#cvs{display:block;width:100%;aspect-ratio:16/9;margin-top:12px;background:#02040c;border:2px solid var(--bl);border-radius:16px;cursor:pointer;touch-action:manipulation;box-shadow:0 0 40px rgba(47,140,255,.25)}
#ci{margin-top:10px;font-size:.95rem}#cos label{display:block;margin-top:6px;color:var(--mut)}#sp{width:min(100%,320px);vertical-align:middle}
#ils{max-width:1400px;margin:18px auto;padding:0 12px}
.il{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.il svg{width:100%;display:block;border-radius:8px;margin-bottom:8px}.il .cd{padding:10px}.il .cd span{line-height:1.6}
#cbx{position:fixed;z-index:50;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#cfab{position:relative;width:62px;height:62px;border:0;border-radius:50%;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--bl),var(--or));box-shadow:0 6px 24px rgba(255,122,26,.5);animation:bob 3s ease-in-out infinite;display:grid;place-items:center}
#cfab:before,#cfab:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--or);animation:rp 2.4s ease-out infinite}
#cfab:after{animation-delay:1.2s;border-color:var(--bl)}
#cfab svg{width:28px;height:28px;animation:wig 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes rp{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(12deg)}}
#cpn{width:min(86vw,300px);background:var(--card);border:1px solid var(--bl);border-top:3px solid var(--or);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:.9rem}
#cpn[hidden]{display:none}#cpn p{margin:6px 0}#cpe{color:var(--or);font-weight:700;word-break:break-all}
.bt{background:var(--bl);color:#fff;border-radius:8px;padding:5px 12px;text-decoration:none}
@media(prefers-reduced-motion:reduce){#cfab,#cfab:before,#cfab:after,#cfab svg{animation:none}}
.fx{position:relative;width:min(100%,1000px);aspect-ratio:1278/832;margin:0 auto;overflow:hidden;border-radius:18px;border:2px solid var(--bl);box-shadow:0 0 50px rgba(255,122,26,.35);background:#020611}
.zm{position:absolute;inset:0;animation:zmk 20s ease-in-out infinite alternate;transform-origin:50% 60%}
.fb{position:absolute;inset:0;width:100%;height:100%;display:block}.ia{position:absolute;display:block;height:auto}
#fxb,#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#fxc{mix-blend-mode:screen}
.eg{position:absolute;left:36.6%;top:9.4%;width:33.2%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 60px 20px rgba(80,160,255,.4);mix-blend-mode:screen;animation:egp 4s ease-in-out infinite alternate}
.sp2{animation:spn 30s linear infinite}.trl{mix-blend-mode:screen;animation:trk 3.5s ease-in-out infinite alternate}
.lw{position:absolute;animation:lgf 6s ease-in-out infinite}.lw img{width:100%;display:block}
.sh{position:absolute;inset:0;-webkit-mask:var(--lg) center/100% 100% no-repeat;mask:var(--lg) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:300% 100%;background-position:150% 0;animation:shn 4.5s ease-in-out infinite}
#cr{position:absolute;inset:0;transform-origin:62% 55%;will-change:transform}
#fll,#flr{filter:url(#fw) saturate(1.25) brightness(1.1);mix-blend-mode:screen}#fll{transform-origin:93% 6%}#flr{transform-origin:80% 7%}
@keyframes zmk{from{transform:scale(1)}to{transform:scale(1.05) translate(-.5%,.4%)}}
@keyframes egp{from{opacity:.45;transform:scale(1)}to{opacity:1;transform:scale(1.03)}}
@keyframes spn{to{transform:rotate(360deg)}}
@keyframes trk{from{transform:translate(-5px,3px);opacity:.55;filter:hue-rotate(0)}to{transform:translate(4px,-3px);opacity:1;filter:hue-rotate(25deg) brightness(1.2)}}
@keyframes lgf{0%,100%{transform:translateY(0) rotate(0);filter:drop-shadow(0 0 6px rgba(255,150,50,.4))}50%{transform:translateY(-6px) rotate(.5deg) scale(1.01);filter:drop-shadow(0 0 16px rgba(255,160,60,.9))}}
@keyframes shn{to{background-position:-50% 0}}
@media(prefers-reduced-motion:reduce){.zm,.eg,.sp2,.trl,.lw,.sh{animation:none}}
#lg div{border-bottom:1px solid var(--bd);padding:3px 0}
.bg{display:inline-block;background:var(--or);color:#fff;border-radius:6px;padding:2px 8px;font-size:.75rem;margin-top:8px}
.tg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tg button{background:var(--card);color:var(--tx);border:1px solid var(--bl);border-radius:8px;padding:5px 10px;cursor:pointer}.tg button.on{background:var(--bl);color:#fff}
footer{text-align:center;padding:24px;color:var(--mut);border-top:1px solid var(--bd)}

var DS={en:["A G-type star holding 99.86% of the Solar System’s mass; its core reaches ~15 million °C.","Smallest planet: scorching days, freezing nights, no atmosphere.","Hottest planet: thick CO₂ clouds trap heat; it spins backwards.","Our home, the only known world with life and liquid oceans.","Earth’s only natural satellite, 384,400 km away, always showing one face.","The red planet: iron-oxide dust and the giant volcano Olympus Mons.","Gas giant; the Great Red Spot storm is wider than Earth.","Gas giant with spectacular rings of ice and rock.","Ice giant rotating on its side, with faint rings.","Windiest planet: supersonic storms and deep-blue methane clouds.","Our barred spiral galaxy: 100,000 ly wide, 100–400 billion stars; the Sun orbits its centre every ~230 million years.","Nearest large galaxy, 2.5 million ly away, approaching us at ~110 km/s."],
ru:["Звезда класса G, на которую приходится 99,86% массы Солнечной системы; в ядре ~15 млн °C.","Самая маленькая планета: жаркие дни, ледяные ночи, нет атмосферы.","Самая горячая планета: плотные облака CO₂ удерживают тепло; вращается в обратную сторону.","Наш дом — единственный известный мир с жизнью и жидкими океанами.","Единственный естественный спутник Земли, в 384 400 км, всегда обращён одной стороной.","Красная планета: пыль оксида железа, гигантский вулкан Олимп.","Газовый гигант; Большое красное пятно шире Земли.","Газовый гигант с великолепными кольцами изо льда и камня.","Ледяной гигант, вращающийся «лёжа на боку», со слабыми кольцами.","Самая ветреная планета: сверхзвуковые бури и синие метановые облака.","Наша галактика со спиральной перемычкой: 100 000 св. лет, 100–400 млрд звёзд; Солнце обходит центр за ~230 млн лет.","Ближайшая крупная галактика, 2,5 млн св. лет; приближается к нам со скоростью ~110 км/с."],
de:["Stern vom Typ G mit 99,86 % der Masse des Sonnensystems; Kerntemperatur ~15 Mio. °C.","Kleinster Planet: glühende Tage, eisige Nächte, keine Atmosphäre.","Heißester Planet: dichte CO₂-Wolken speichern Wärme; rotiert rückwärts.","Unser Zuhause – die einzige bekannte Welt mit Leben und flüssigen Ozeanen.","Einziger natürlicher Erdtrabant, 384.400 km entfernt, zeigt stets dieselbe Seite.","Der rote Planet: Eisenoxidstaub und der Riesenvulkan Olympus Mons.","Gasriese; der Große Rote Fleck ist breiter als die Erde.","Gasriese mit prächtigen Ringen aus Eis und Gestein.","Eisriese, der auf der Seite rotiert, mit schwachen Ringen.","Windigster Planet: Überschallstürme und tiefblaue Methanwolken.","Unsere Balkenspiralgalaxie: 100.000 Lj breit, 100–400 Mrd. Sterne; die Sonne umrundet das Zentrum in ~230 Mio. Jahren.","Nächste große Galaxie, 2,5 Mio. Lj entfernt, nähert sich mit ~110 km/s."],
tr:["Güneş Sistemi kütlesinin %99,86’sını barındıran G tipi yıldız; çekirdeği ~15 milyon °C.","En küçük gezegen: kavurucu gündüz, dondurucu gece, atmosfer yok.","En sıcak gezegen: yoğun CO₂ bulutları ısıyı hapseder; ters döner.","Yuvamız; yaşamın ve sıvı okyanusların bilindiği tek dünya.","Dünya’nın tek doğal uydusu, 384.400 km uzakta, hep aynı yüzünü gösterir.","Kızıl gezegen: demir oksit tozu ve dev Olympus Mons yanardağı.","Gaz devi; Büyük Kırmızı Leke Dünya’dan geniştir.","Buz ve kayadan muhteşem halkalara sahip gaz devi.","Yan yatmış dönen buz devi; soluk halkaları var.","En rüzgârlı gezegen: ses üstü fırtınalar ve mavi metan bulutları.","Çubuklu sarmal galaksimiz: 100.000 ış genişliğinde, 100–400 milyar yıldız; Güneş merkezi ~230 milyon yılda dolanır.","En yakın büyük galaksi, 2,5 milyon ış uzakta; ~110 km/sn ile yaklaşıyor."],
no:["G-type stjerne med 99,86 % av solsystemets masse; kjernen er ~15 millioner °C.","Minste planet: brennende dager, iskalde netter, ingen atmosfære.","Varmeste planet: tette CO₂-skyer fanger varme; roterer baklengs.","Vårt hjem – den eneste kjente verden med liv og flytende hav.","Jordens eneste måne, 384 400 km unna, viser alltid samme side.","Den røde planeten: jernoksidstøv og kjempevulkanen Olympus Mons.","Gasskjempe; Den store røde flekken er bredere enn jorden.","Gasskjempe med praktfulle ringer av is og stein.","Iskjempe som roterer på siden, med svake ringer.","Vindfullest planet: supersoniske stormer og dypblå metanskyer.","Vår stavspiralgalakse: 100 000 lysår bred, 100–400 milliarder stjerner; sola går rundt sentrum på ~230 millioner år.","Nærmeste store galakse, 2,5 millioner lysår unna, nærmer seg med ~110 km/s."],
sv:["G-typ stjärna med 99,86 % av solsystemets massa; kärnan är ~15 miljoner °C.","Minsta planeten: brännheta dagar, iskalla nätter, ingen atmosfär.","Hetaste planeten: tjocka CO₂-moln fångar värme; roterar bakvänt.","Vårt hem – den enda kända världen med liv och flytande hav.","Jordens enda måne, 384 400 km bort, visar alltid samma sida.","Den röda planeten: järnoxiddamm och jättevulkanen Olympus Mons.","Gasjätte; Stora röda fläcken är bredare än jorden.","Gasjätte med praktfulla ringar av is och sten.","Isjätte som roterar på sidan, med svaga ringar.","Blåsigaste planeten: överljudsstormar och djupblå metanmoln.","Vår stavspiralgalax: 100 000 ljusår bred, 100–400 miljarder stjärnor; solen kretsar kring centrum på ~230 miljoner år.","Närmaste stora galax, 2,5 miljoner ljusår bort, närmar sig med ~110 km/s."],
ar:["نجم من النوع G يحوي 99.86% من كتلة المجموعة الشمسية، وحرارة لبّه نحو 15 مليون °م.","أصغر كوكب: نهار حارق وليل متجمد وبلا غلاف جوي.","أسخن كوكب: سحب CO₂ كثيفة تحبس الحرارة، ويدور بعكس الاتجاه.","موطننا، العالم الوحيد المعروف بالحياة والمحيطات السائلة.","القمر الطبيعي الوحيد للأرض، يبعد 384,400 كم ويُظهر وجهًا واحدًا دائمًا.","الكوكب الأحمر: غبار أكسيد الحديد وبركان أوليمبوس العملاق.","عملاق غازي؛ البقعة الحمراء العظيمة أعرض من الأرض.","عملاق غازي بحلقات رائعة من الجليد والصخور.","عملاق جليدي يدور على جانبه وله حلقات خافتة.","أكثر الكواكب رياحًا: عواصف أسرع من الصوت وسحب ميثان زرقاء.","مجرتنا الحلزونية ذات القضيب: عرضها 100,000 سنة ضوئية وفيها 100–400 مليار نجم؛ تدور الشمس حول مركزها كل ~230 مليون سنة.","أقرب مجرة كبيرة، تبعد 2.5 مليون سنة ضوئية وتقترب منا بنحو 110 كم/ث."],
ku:["ئەستێرەی جۆری G، ٩٩.٨٦٪ی کێشی سیستەمی خۆر لەخۆ دەگرێت؛ ناوەندی نزیکەی ١٥ ملیۆن پلەیە.","بچووکترین هەسارە: ڕۆژی سووتێنەر، شەوی بەستوو، بێ کەشوهەوا.","گەرمترین هەسارە: هەوری چڕی CO₂ گەرمی دەگرێتەوە؛ بە پێچەوانە دەخولێتەوە.","ماڵی ئێمە، تاکە جیهانی ناسراو بە ژیان و زەریای شلە.","تاکە مانگی سروشتی زەوی، ٣٨٤٬٤٠٠ کم دوورە و هەمیشە یەک ڕووی پیشان دەدات.","هەسارەی سوور: تۆزی ئۆکسیدی ئاسن و بورکانی گەورەی ئۆلیمپۆس.","گەورەیەکی گازییە؛ خاڵی سووری گەورە لە زەوی پانترە.","گەورەیەکی گازییە کە بازنەی سەرنجڕاکێشی لە سەهۆڵ و بەرد هەیە.","گەورەیەکی سەهۆڵییە کە لەسەر لایەکی دەخولێتەوە و بازنەی لاوازی هەیە.","با-ترین هەسارە: گێژەڵوکەی خێراتر لە دەنگ و هەوری شینی میسان.","گەلاکسی ئێمەی مارپێچی: ١٠٠٬٠٠٠ ساڵی ڕووناکی پانە، ١٠٠–٤٠٠ ملیار ئەستێرە؛ خۆر هەر ~٢٣٠ ملیۆن ساڵ جارێک بە دەوری ناوەندیدا دەسوڕێتەوە.","نزیکترین گەلاکسی گەورە، ٢.٥ ملیۆن ساڵی ڕووناکی دوورە و بە ~١١٠ کم/چ نزیک دەبێتەوە."]};

var D={
en:{h:"Beyond Earth. Beyond limits.",t:["About us","Satellites","Outer space","Galaxies","Travel requirements","Flight safety","Gravity"],b:["MR.AN7 APEX SPACE is a space-technology company focused on launch systems, satellites and space-exploration research.","Satellites orbit Earth for communication, navigation, weather forecasting and Earth observation. We design, launch and operate them.","Outer-space studies use telescopes, probes and spacecraft to understand planets, stars, black holes and the origins of the universe.","The Milky Way holds 100–400 billion stars. The observable universe has roughly 200 billion to 2 trillion galaxies.","Space travel needs strict medical fitness, 1–2 years of training, a spacecraft, spacesuits, oxygen, food, water, power and ground control.","Safety means a pressurized cabin, life support, radiation shielding, fire protection, escape systems, drills and constant monitoring.","In orbit astronauts float because they are in free fall; gravity there is still ~90% of Earth’s. The Moon has 1/6 g, Mars 38%."]},
ru:{h:"За пределами Земли. За пределами границ.",t:["О нас","Спутники","Космос","Галактики","Требования к полёту","Безопасность полёта","Гравитация"],b:["MR.AN7 APEX SPACE — космическая технологическая компания: ракеты-носители, спутники и исследования космоса.","Спутники вращаются вокруг Земли для связи, навигации, прогноза погоды и наблюдения. Мы их проектируем, запускаем и обслуживаем.","Изучение космоса с помощью телескопов, зондов и кораблей помогает понять планеты, звёзды, чёрные дыры и происхождение Вселенной.","В Млечном Пути 100–400 млрд звёзд. В наблюдаемой Вселенной примерно от 200 млрд до 2 трлн галактик.","Для полёта нужны медицинский отбор, 1–2 года подготовки, корабль, скафандры, кислород, еда, вода, энергия и центр управления.","Безопасность: герметичная кабина, жизнеобеспечение, защита от радиации и пожара, системы спасения, тренировки и мониторинг.","На орбите астронавты парят из-за свободного падения; гравитация там всё ещё ~90% земной. На Луне 1/6 g, на Марсе 38%."]},
de:{h:"Jenseits der Erde. Jenseits aller Grenzen.",t:["Über uns","Satelliten","Weltraum","Galaxien","Reiseanforderungen","Flugsicherheit","Schwerkraft"],b:["MR.AN7 APEX SPACE ist ein Raumfahrtunternehmen für Trägersysteme, Satelliten und Weltraumforschung.","Satelliten umkreisen die Erde für Kommunikation, Navigation, Wettervorhersage und Erdbeobachtung. Wir entwickeln, starten und betreiben sie.","Die Erforschung des Weltraums mit Teleskopen, Sonden und Raumschiffen erklärt Planeten, Sterne, Schwarze Löcher und den Ursprung des Universums.","Die Milchstraße hat 100–400 Milliarden Sterne. Das beobachtbare Universum enthält etwa 200 Milliarden bis 2 Billionen Galaxien.","Nötig sind strenge Gesundheitsprüfung, 1–2 Jahre Training, Raumschiff, Raumanzüge, Sauerstoff, Nahrung, Wasser, Energie und Bodenkontrolle.","Sicherheit heißt: Druckkabine, Lebenserhaltung, Strahlungs- und Brandschutz, Rettungssysteme, Übungen und ständige Überwachung.","Im Orbit schweben Astronauten im freien Fall; die Schwerkraft beträgt dort noch ~90 % der irdischen. Mond: 1/6 g, Mars: 38 %."]},
ku:{h:"لە دەرەوەی زەوی. لە دەرەوەی سنوور.",t:["دەربارەی ئێمە","مانگە دەستکردەکان","بۆشایی دەرەوە","گەلاکسییەکان","پێداویستییەکانی گەشت","سەلامەتی فڕین","ڕاکێشان"],b:["MR.AN7 APEX SPACE کۆمپانیایەکی تەکنەلۆجیای ئاسمانییە، تایبەتە بە سیستەمی ئاگردان، مانگە دەستکردەکان و توێژینەوەی ئاسمان.","مانگە دەستکردەکان بۆ پەیوەندی، ڕێنیشاندان، پێشبینی کەشوهەوا و چاودێری زەوی بە دەوری زەویدا دەسوڕێنەوە. ئێمە دیزاینیان دەکەین، دەیاننێرین و بەڕێوەیان دەبەین.","توێژینەوەی بۆشایی دەرەوە بە تەلەسکۆپ و پرۆب و کەشتی ئاسمانی یارمەتیمان دەدات هەسارەکان، ئەستێرەکان، کونە ڕەشەکان و سەرچاوەی گەردوون تێبگەین.","ڕێگای شیر ١٠٠–٤٠٠ ملیار ئەستێرەی هەیە. گەردوونی بینراو نزیکەی ٢٠٠ ملیار بۆ ٢ تریلیۆن گەلاکسی لەخۆ دەگرێت.","گەشتی ئاسمانی پێویستی بە پشکنینی تەندروستی توند، ١–٢ ساڵ ڕاهێنان، کەشتی ئاسمانی، جلی ئاسمانی، ئۆکسجین، خۆراک، ئاو، وزە و ناوەندی کۆنترۆڵی سەر زەوییە.","سەلامەتی واتە ژووری گوشراو، پشتگیری ژیان، پاراستن لە تیشک و ئاگر، سیستەمی ڕزگارکردن، ڕاهێنان و چاودێری بەردەوام.","لە مەداردا ئاسمانناسان دەخولێنەوە چونکە لە کەوتنی ئازاددان؛ ڕاکێشان لەوێ هێشتا ~٪٩٠ی زەوییە. مانگ ١/٦ و مریخ ٪٣٨."]},
tr:{h:"Dünya’nın ötesinde. Sınırların ötesinde.",t:["Hakkımızda","Uydular","Uzay","Galaksiler","Yolculuk Gereksinimleri","Uçuş Güvenliği","Yerçekimi"],b:["MR.AN7 APEX SPACE; fırlatma sistemleri, uydular ve uzay keşif araştırmalarına odaklanan bir uzay teknolojisi şirketidir.","Uydular iletişim, navigasyon, hava tahmini ve Dünya gözlemi için yörüngede döner. Onları tasarlar, fırlatır ve işletiriz.","Teleskoplar, sondalar ve uzay araçlarıyla yapılan çalışmalar gezegenleri, yıldızları, kara delikleri ve evrenin kökenini anlamamızı sağlar.","Samanyolu’nda 100–400 milyar yıldız vardır. Gözlemlenebilir evrende yaklaşık 200 milyar ila 2 trilyon galaksi bulunur.","Sıkı sağlık kontrolü, 1–2 yıl eğitim, uzay aracı, uzay giysisi, oksijen, yiyecek, su, enerji ve yer kontrol merkezi gerekir.","Güvenlik: basınçlı kabin, yaşam destek, radyasyon ve yangın koruması, kurtarma sistemleri, tatbikatlar ve sürekli izleme.","Yörüngede astronotlar serbest düşüş nedeniyle süzülür; yerçekimi hâlâ Dünya’nınkinin ~%90’ıdır. Ay’da 1/6 g, Mars’ta %38."]},
ar:{h:"ما وراء الأرض. ما وراء الحدود.",t:["من نحن","الأقمار الصناعية","الفضاء الخارجي","المجرات","متطلبات الرحلة","السلامة الجوية","الجاذبية"],b:["MR.AN7 APEX SPACE شركة تقنيات فضائية تركز على أنظمة الإطلاق والأقمار الصناعية وأبحاث استكشاف الفضاء.","تدور الأقمار الصناعية حول الأرض للاتصالات والملاحة والتنبؤ بالطقس ومراقبة الأرض. نحن نصممها ونطلقها ونشغّلها.","تعتمد دراسة الفضاء الخارجي على التلسكوبات والمسابر والمركبات لفهم الكواكب والنجوم والثقوب السوداء ونشأة الكون.","تضم مجرة درب التبانة 100–400 مليار نجم، ويضم الكون المرصود نحو 200 مليار إلى 2 تريليون مجرة.","تتطلب الرحلة فحصًا طبيًا صارمًا وتدريبًا من 1–2 سنة ومركبة وبدلات فضاء وأكسجينًا وغذاءً وماءً وطاقة ومركز تحكم أرضيًا.","السلامة تعني مقصورة مضغوطة وأنظمة دعم الحياة وحماية من الإشعاع والحريق وأنظمة إخلاء وتدريبات ومراقبة مستمرة.","يطفو رواد الفضاء في المدار لأنهم في سقوط حر؛ والجاذبية هناك ~90% من جاذبية الأرض. القمر 1/6 والمريخ 38%."]},
no:{h:"Hinsides jorden. Hinsides grenser.",t:["Om oss","Satellitter","Verdensrommet","Galakser","Reisekrav","Flysikkerhet","Tyngdekraft"],b:["MR.AN7 APEX SPACE er et romteknologiselskap som fokuserer på bæreraketter, satellitter og romforskning.","Satellitter går i bane rundt jorden for kommunikasjon, navigasjon, værvarsling og jordobservasjon. Vi designer, skyter opp og driver dem.","Romforskning med teleskoper, sonder og romfartøy hjelper oss å forstå planeter, stjerner, sorte hull og universets opprinnelse.","Melkeveien har 100–400 milliarder stjerner. Det observerbare universet har omtrent 200 milliarder til 2 billioner galakser.","Romreiser krever streng helsesjekk, 1–2 års trening, romskip, romdrakter, oksygen, mat, vann, strøm og bakkekontroll.","Sikkerhet betyr trykksatt kabin, livsstøtte, strålings- og brannvern, rømningssystemer, øvelser og konstant overvåkning.","I bane flyter astronautene fordi de er i fritt fall; tyngdekraften er der fortsatt ~90 % av jordens. Månen: 1/6 g, Mars: 38 %."]},
sv:{h:"Bortom jorden. Bortom gränser.",t:["Om oss","Satelliter","Rymden","Galaxer","Resekrav","Flygsäkerhet","Gravitation"],b:["MR.AN7 APEX SPACE är ett rymdteknikföretag med fokus på bärraketer, satelliter och rymdforskning.","Satelliter kretsar runt jorden för kommunikation, navigering, väderprognoser och jordobservation. Vi konstruerar, skjuter upp och driver dem.","Rymdforskning med teleskop, sonder och rymdfarkoster hjälper oss förstå planeter, stjärnor, svarta hål och universums ursprung.","Vintergatan har 100–400 miljarder stjärnor. Det observerbara universum har ungefär 200 miljarder till 2 biljoner galaxer.","Rymdresor kräver strikt hälsokontroll, 1–2 års träning, rymdfarkost, rymddräkter, syre, mat, vatten, ström och markkontroll.","Säkerhet innebär trycksatt kabin, livsuppehållande system, strålnings- och brandskydd, nödsystem, övningar och ständig övervakning.","I omloppsbana svävar astronauter i fritt fall; gravitationen är fortfarande ~90 % av jordens. Månen: 1/6 g, Mars: 38 %."]}};
